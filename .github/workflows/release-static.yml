name: Release Static FFmpeg (amd64)

on:
  workflow_dispatch:
    inputs:
      ffmpeg_branch:
        description: 'FFmpeg branch to build'
        type: choice
        options:
          - '7.1'
          - '8.1'
          - '9.0'
        default: '8.1'
        required: false
      doRelease:
        description: 'Publish new release'
        type: boolean
        default: true
        required: false
  workflow_call:
    inputs:
      ffmpeg_branch:
        description: 'FFmpeg branch to build'
        type: string
        default: '8.1'
        required: false
      doRelease:
        description: 'Publish new release'
        type: boolean
        default: true
        required: false
permissions:
  contents: write
  packages: write

env:
  DOCKER_BUILDKIT: 1

jobs:
  build_base:
    name: Build base image
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
      DOCKER_TAG_SUFFIX: -x86
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image Name
        id: imagename
        run: |
          IMG="${GITHUB_REPOSITORY,,}/base"
          IMG="${IMG// /-}"
          echo "name=ghcr.io/${IMG}" >> $GITHUB_OUTPUT
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Build target base image
        uses: docker/build-push-action@v7
        with:
          context: images/base
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest-${{ env.ARCH }}
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache-${{ env.ARCH }}
          cache-from: type=registry,ref=${{ steps.imagename.outputs.name }}:cache-${{ env.ARCH }}
      - name: Record image
        uses: ./.github/actions/record-image
        with:
          image: ${{ steps.imagename.outputs.name }}
          arch: ${{ env.ARCH }}
          stage: base
      - name: Get download cache key
        id: dl_cache
        run: |
          echo "dltagname=$(./util/get_dl_cache_tag.sh)" >> $GITHUB_OUTPUT
      - name: Cache
        uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: download-cache-${{ steps.dl_cache.outputs.dltagname }}
          restore-keys: |
            download-cache-
      - name: Update Cache
        run: |
          set -e
          ./download.sh
          ./util/clean_cache.sh
          tar czf .cache/cache.tar.gz .cache/downloads/*

  merge_base:
    name: Merge base image
    needs: build_base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Merge images
        id: merge
        uses: ./.github/actions/merge-images
        with:
          stage: base
      - name: Package Names
        id: pkgs
        env:
          IMAGES: ${{ steps.merge.outputs.images }}
        run: |
          PKGS=()
          for IMG in $IMAGES; do
            PKGS+=("${IMG#ghcr.io/*/}")
          done
          echo "names=$(IFS=,; echo "${PKGS[*]}")" >> $GITHUB_OUTPUT
      - name: Cleanup
        if: ${{ steps.pkgs.outputs.names != '' }}
        continue-on-error: true
        uses: BtbN/delete-untagged-ghcr-action@main
        with:
          token: ${{ github.token }}
          package_name: ${{ steps.pkgs.outputs.names }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          owner_type: user
          untagged_only: true

  build_target_bases:
    name: Build target base image
    needs: [build_base, merge_base]
    runs-on: ubuntu-latest
    env:
      ARCH: x86
    strategy:
      fail-fast: false
      matrix:
        target: [linux64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image Name
        id: imagename
        run: |
          IMG="${GITHUB_REPOSITORY,,}/base-${{ matrix.target }}"
          IMG="${IMG// /-}"
          echo "name=ghcr.io/${IMG}" >> $GITHUB_OUTPUT
          echo "gh_repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Build target base image
        uses: docker/build-push-action@v7
        with:
          context: images/base-${{ matrix.target }}
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest-${{ env.ARCH }}
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache-${{ env.ARCH }}
          cache-from: type=registry,ref=${{ steps.imagename.outputs.name }}:cache-${{ env.ARCH }}
          build-args: |
            GH_REPO=ghcr.io/${{ steps.imagename.outputs.gh_repo }}
      - name: Record image
        uses: ./.github/actions/record-image
        with:
          image: ${{ steps.imagename.outputs.name }}
          arch: ${{ env.ARCH }}
          stage: targetbase

  merge_target_bases:
    name: Merge target base images
    needs: build_target_bases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Merge images
        id: merge
        uses: ./.github/actions/merge-images
        with:
          stage: targetbase
      - name: Package Names
        id: pkgs
        env:
          IMAGES: ${{ steps.merge.outputs.images }}
        run: |
          PKGS=()
          for IMG in $IMAGES; do
            PKGS+=("${IMG#ghcr.io/*/}")
          done
          echo "names=$(IFS=,; echo "${PKGS[*]}")" >> $GITHUB_OUTPUT
      - name: Cleanup
        if: ${{ steps.pkgs.outputs.names != '' }}
        continue-on-error: true
        uses: BtbN/delete-untagged-ghcr-action@main
        with:
          token: ${{ github.token }}
          package_name: ${{ steps.pkgs.outputs.names }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          owner_type: user
          untagged_only: true

  build_targets:
    name: Build target-variant image
    needs: [build_target_bases, merge_target_bases]
    runs-on: ubuntu-latest
    env:
      ARCH: x86
    strategy:
      fail-fast: false
      matrix:
        target: [linux64]
        branch: ['${{ inputs.ffmpeg_branch }}']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image Name
        id: imagename
        run: |
          IMG="${GITHUB_REPOSITORY,,}/${{ matrix.target }}-gpl-${{ matrix.branch }}"
          IMG="${IMG// /-}"
          echo "name=ghcr.io/${IMG}" >> $GITHUB_OUTPUT
      - name: Get download cache key
        id: dl_cache
        run: |
          echo "dltagname=$(./util/get_dl_cache_tag.sh)" >> $GITHUB_OUTPUT
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Generate Dockerfile
        run: ./generate.sh ${{ matrix.target }} gpl ${{ matrix.branch }}
      - name: Cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/downloads
          key: download-cache-${{ steps.dl_cache.outputs.dltagname }}
          fail-on-cache-miss: true
      - name: Build target base image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest-${{ env.ARCH }}
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache-${{ env.ARCH }}
          cache-from: type=registry,ref=${{ steps.imagename.outputs.name }}:cache-${{ env.ARCH }}
      - name: Record image
        uses: ./.github/actions/record-image
        with:
          image: ${{ steps.imagename.outputs.name }}
          arch: ${{ env.ARCH }}
          stage: variant

  merge_targets:
    name: Merge target-variant images
    needs: build_targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Merge images
        id: merge
        uses: ./.github/actions/merge-images
        with:
          stage: variant
      - name: Package Names
        id: pkgs
        env:
          IMAGES: ${{ steps.merge.outputs.images }}
        run: |
          PKGS=()
          for IMG in $IMAGES; do
            PKGS+=("${IMG#ghcr.io/*/}")
          done
          echo "names=$(IFS=,; echo "${PKGS[*]}")" >> $GITHUB_OUTPUT
      - name: Cleanup
        if: ${{ steps.pkgs.outputs.names != '' }}
        continue-on-error: true
        uses: BtbN/delete-untagged-ghcr-action@main
        with:
          token: ${{ github.token }}
          package_name: ${{ steps.pkgs.outputs.names }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          owner_type: user
          untagged_only: true

  build_ffmpeg:
    name: Build ffmpeg
    needs: [build_targets, merge_targets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux64]
        branch: ['${{ inputs.ffmpeg_branch }}']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build ffmpeg
        run: |
          T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
          ./build.sh ${{ matrix.target }} gpl ${{ matrix.branch }}
      - name: Replace spaces in string
        id: strs
        run: |
          SLUG="${{ matrix.target }}-gpl-${{ matrix.branch }}"
          echo "artifact_slug=${SLUG// /-}" >> $GITHUB_OUTPUT
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-${{ steps.strs.outputs.artifact_slug }}
          overwrite: true
          retention-days: 1
          path: artifacts/*

  publish_release:
    name: Publish release
    if: ${{ !cancelled() && (inputs.doRelease == true || github.event.inputs.doRelease == 'true') && needs.build_ffmpeg.result == 'success' }}
    needs: build_ffmpeg
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools p7zip-full
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-*
          merge-multiple: true
          path: artifacts
      - name: Create release
        id: create_release
        run: |
          set -xe
          shopt -s nullglob
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAGNAME="${GITHUB_REF_NAME}"
          else
            TAGNAME="release-$(date +'%Y-%m-%d')"
          fi
          RELDATE="$(date +'%Y-%m-%d %H:%M')"
          NAME="Auto-Build $RELDATE"
          (cd artifacts && sha256sum *.{zip,tar.xz} > checksums.sha256)
          ./util/release_body.sh "$TAGNAME" artifacts/*.{zip,tar.xz} > release_body.md
          gh release create "$TAGNAME" --target "master" --title "$NAME" --notes-file release_body.md artifacts/*.{zip,tar.xz} artifacts/checksums.*
          echo "tag_name=${TAGNAME}" >> $GITHUB_OUTPUT
          echo "rel_date=${RELDATE}" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ github.token }}