name: Check upstream FFmpeg releases

# Daily check of FFmpeg upstream release tags (n<version>).
# When a new n-tag is found (or a rebuild is forced), it triggers
# release-static.yml for that branch with doRelease=true.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild of current releases (debug)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  actions: write
  variables: write

jobs:
  check:
    name: Check upstream branch ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        branch: ['7.1', '8.1', '9.0']
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORCE: ${{ inputs.force || false }}
    steps:
      - name: Compare upstream tags to last-seen variables
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail

          PRIMARY_URL="https://github.com/FFmpeg/FFmpeg.git"
          FALLBACK_URL="https://github.com/BtbN/ffmpeg.git"

          # variable name suffix per branch (7.1 -> 71, ...)
          SUFFIX="${BRANCH//./}"
          VAR="LAST_SEEN_${SUFFIX}"

          # Try primary upstream; fall back to mirror if unreachable.
          URL="$PRIMARY_URL"
          REMOTE_OUTPUT="$(timeout 60 git ls-remote "$URL" "refs/tags/n${BRANCH}.*" 2>/dev/null || true)"
          if [ -z "$REMOTE_OUTPUT" ]; then
            echo "Primary upstream unreachable/empty; trying fallback mirror."
            URL="$FALLBACK_URL"
            REMOTE_OUTPUT="$(timeout 60 git ls-remote "$URL" "refs/tags/n${BRANCH}.*" 2>/dev/null || true)"
          fi
          if [ -z "$REMOTE_OUTPUT" ]; then
            echo "::error::Both upstream sources unreachable."
            exit 1
          fi
          echo "Using upstream source: $URL"

          # Pick latest semver n-tag for this branch (e.g. n8.1.3).
          latest_tag="$(printf '%s\n' "$REMOTE_OUTPUT" \
            | sed 's/.*refs\/tags\///' \
            | sed 's/\^{}//' \
            | grep -E "^n${BRANCH//./\\.}\\." \
            | sort -Vu \
            | tail -n 1)"
          if [ -z "$latest_tag" ]; then
            echo "No n-tags found for branch ${BRANCH}; skipping."
            exit 0
          fi
          echo "Latest upstream tag: $latest_tag"

          old="$(gh variable get "$VAR" --repo "$REPO" 2>/dev/null || true)"

          build=false
          if [ "${FORCE}" = "true" ]; then
            echo "Force rebuild requested."
            build=true
          elif [ -z "$old" ] || [ "$old" != "$latest_tag" ]; then
            echo "New tag detected (${old:-<unset>} -> $latest_tag)."
            build=true
          else
            echo "No new tag (last seen: $old)."
          fi

          # Also rebuild if the per-version release is missing on the fork.
          if [ "$build" != "true" ]; then
            if ! gh release view "ffmpeg-${latest_tag#n}" --repo "$REPO" >/dev/null 2>&1; then
              echo "Release $latest_tag missing on fork; rebuilding."
              build=true
            fi
          fi

          if [ "$build" != "true" ]; then
            echo "Skipping build for ${BRANCH}."
            exit 0
          fi

          echo "Triggering release-static.yml for ${BRANCH} (${latest_tag})..."
          gh workflow run release-static.yml \
            --repo "$REPO" --ref master \
            -f "ffmpeg_branch=${BRANCH}" \
            -f "ffmpeg_tag=${latest_tag}" \
            -f "force=${FORCE}" \
            -f "doRelease=true"

          # Wait for the triggered run to finish to keep builds serial.
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --repo "$REPO" --workflow release-static.yml --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -n "$run_id" ]; then
            echo "Watching run $run_id"
            gh run watch "$run_id" --repo "$REPO" --exit-status || echo "Build run did not succeed."
          fi

          gh variable set "$VAR" --body "$latest_tag" --repo "$REPO"
